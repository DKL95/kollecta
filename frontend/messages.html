<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KollectA — Mensajes</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="messages" data-title="Mensajes" data-subtitle="">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar"></header>

      <main class="messages-shell">
        <div class="thread-list" id="thread-list"></div>

        <div class="chat-col">
          <div class="chat-head" id="chat-head"></div>
          <div class="chat-body" id="chat-body"></div>
          <div class="chat-input-row">
            <button class="icon-btn" title="Adjuntar">📎</button>
            <input type="text" placeholder="Escribe un mensaje…" id="chat-input" />
            <button class="btn btn-primary btn-sm" id="chat-send">Enviar</button>
          </div>
        </div>
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
