<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KollectA — Buscar</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="search" data-title="Buscar" data-subtitle="Grupos, merch y personas en un solo lugar">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar"></header>

      <main class="page" style="max-width:1080px;">
        <div class="tabs">
          <span class="tab active">Todo</span>
          <span class="tab">Merch</span>
          <span class="tab">Grupos</span>
          <span class="tab">Personas</span>
        </div>

        <div class="section-title"><h3>🛍️ Merch relacionado</h3></div>
        <div class="grid grid-4" id="search-products" style="margin-bottom:32px;"></div>

        <div class="section-title"><h3>⭐ Grupos</h3></div>
        <div class="grid grid-4" id="search-groups" style="margin-bottom:32px;"></div>

        <div class="section-title"><h3>👤 Personas</h3></div>
        <div class="grid grid-4" id="search-people"></div>
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
