<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KollectA — Inicio</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="home" data-title="Inicio" data-subtitle="Lo último de tus grupos y amigos">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <div class="layout-2col">
          <div>
            <div class="card composer">
              <span class="avatar" id="composer-avatar" style="width:42px;height:42px;">DL</span>
              <div class="composer-body">
                <input type="text" placeholder="Comparte una nueva pieza de tu colección…" id="composer-input" />
                <div class="composer-actions">
                  <button class="btn btn-secondary btn-sm" id="composer-photo-btn"></button>
                  <button class="btn btn-secondary btn-sm" id="composer-tag-btn"></button>
                  <button class="btn btn-primary btn-sm" style="margin-left:auto;" id="composer-post">Publicar</button>
                </div>
              </div>
            </div>

            <div class="filter-row" id="feed-filters">
              <span class="chip active" data-filter="Todos">Todos</span>
              <span class="chip" data-filter="TWICE">TWICE</span>
              <span class="chip" data-filter="BTS">BTS</span>
              <span class="chip" data-filter="aespa">aespa</span>
              <span class="chip" data-filter="ITZY">ITZY</span>
              <span class="chip" data-filter="BLACKPINK">BLACKPINK</span>
              <span class="chip" data-filter="Stray Kids">Stray Kids</span>
              <span class="chip" data-filter="SEVENTEEN">SEVENTEEN</span>
            </div>

            <div id="feed-list"></div>
          </div>

          <div>
            <div class="card side-card">
              <h4>Grupos sugeridos</h4>
              <div id="side-groups"></div>
              <a href="groups.html" class="see-all">Ver todos los grupos →</a>
            </div>
            <div class="card side-card">
              <h4>Amigos activos</h4>
              <div id="side-friends"></div>
              <a href="messages.html" class="see-all">Ir a mensajes →</a>
            </div>
          </div>
        </div>
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
