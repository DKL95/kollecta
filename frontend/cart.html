<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KollectA — Carrito</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="cart" data-title="Carrito" data-subtitle="Revisa tu pedido antes de pagar">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <div class="layout-2col">
          <div>
            <div class="section-title"><h3>Artículos (<span id="cart-count">3</span>)</h3></div>
            <div id="cart-list"></div>

            <div class="card" style="padding:18px; margin-top:16px;">
              <div class="section-title" style="margin-bottom:10px;"><h3>Dirección de envío</h3></div>
              <div class="field-row">
                <div class="field"><label>Nombre</label><input type="text" value="Derek Luna" /></div>
                <div class="field"><label>Teléfono</label><input type="text" value="81 1234 5678" /></div>
              </div>
              <div class="field"><label>Dirección</label><input type="text" value="Av. Universidad 501, Monterrey, NL" /></div>
            </div>
          </div>

          <div>
            <div class="card side-card">
              <h4>Resumen del pedido</h4>
              <div class="summary-row"><span>Subtotal</span><span id="cart-subtotal">$0</span></div>
              <div class="summary-row"><span>Envío</span><span>$99</span></div>
              <div class="summary-row"><span>Comisión de servicio</span><span id="cart-fee">$0</span></div>
              <div class="summary-row total"><span>Total</span><span id="cart-total">$0</span></div>
              <button class="btn btn-primary btn-block" style="margin-top:16px;">Pagar ahora</button>
              <p class="hint" style="text-align:center; margin-top:10px;">Pago simulado — solo para fines de maquetado.</p>
            </div>
            <div class="card side-card">
              <h4>¿Tienes un código?</h4>
              <div style="display:flex; gap:8px;">
                <input type="text" placeholder="Código de descuento" style="flex:1; background: rgba(255,255,255,0.04); border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:10px 12px; color:var(--text);" />
                <button class="btn btn-secondary btn-sm">Aplicar</button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
