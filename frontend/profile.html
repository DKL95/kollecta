<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KollectA — Mi perfil</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="profile" data-title="Perfil" data-subtitle="">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="main-col">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <div class="profile-cover" id="profile-cover" style="background: var(--gradient-brand);">
          <span class="avatar cover-avatar" id="profile-cover-avatar"></span>
        </div>

        <div class="profile-head">
          <div>
            <h2 id="profile-name"></h2>
            <div class="handle" id="profile-handle"></div>
            <div class="badges-row">
              <span class="pill pink" id="profile-group"></span>
              <span class="pill gold" id="profile-bias"></span>
              <span class="pill cyan" id="verified-pill"></span>
            </div>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="btn btn-secondary" id="edit-profile-btn"></button>
            <a href="sell.html" class="btn btn-primary" id="profile-publish-btn"></a>
          </div>
        </div>

        <p class="profile-bio" id="profile-bio"></p>

        <div class="profile-stats">
          <div class="stat"><b>76</b><span>Artículos</span></div>
          <div class="stat"><b>482</b><span>Seguidores</span></div>
          <div class="stat"><b>213</b><span>Siguiendo</span></div>
          <div class="stat"><b>34</b><span>Intercambios</span></div>
          <div class="stat"><b>4.9</b><span>Reputación</span></div>
        </div>

        <div class="tabs">
          <span class="tab active">Colección</span>
          <span class="tab">Publicaciones</span>
          <span class="tab">Grupos que sigo</span>
          <span class="tab">Reseñas</span>
        </div>

        <div class="grid grid-4" id="profile-collection-grid"></div>
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/app.js"></script>
  <script>
document.addEventListener("DOMContentLoaded", () => {

    const usuarioGuardado = localStorage.getItem("kollecta_usuario");

    if (!usuarioGuardado) {
        return;
    }

    const usuario = JSON.parse(usuarioGuardado);

    // Nombre
    document.getElementById("profile-name").textContent =
        usuario.nombre || usuario.username;

    // Usuario
    document.getElementById("profile-handle").textContent =
        "@" + usuario.username;

    // Descripción
    document.getElementById("profile-bio").textContent =
        usuario.descripcion || "Sin descripción";

    // Grupo favorito
    const grupo = usuario.gruposFavoritos && usuario.gruposFavoritos.length > 0
        ? usuario.gruposFavoritos[0]
        : "";

    document.getElementById("profile-group").textContent = grupo;

    // Bias
    document.getElementById("profile-bias").textContent =
        grupo ? "Grupo favorito: " + grupo : "Sin grupo favorito";

    // Foto de perfil
    const avatar = document.getElementById("profile-cover-avatar");

    if (usuario.fotoPerfil) {

        avatar.innerHTML = `
            <img
                src="${usuario.fotoPerfil}"
                alt="Foto de perfil"
                style="
                    width:100%;
                    height:100%;
                    object-fit:cover;
                "
            >
        `;

    } else {

        avatar.textContent = usuario.username
            ? usuario.username.substring(0, 2).toUpperCase()
            : "U";
    }

});
</script>
</body>
</html>
